<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프로모션 조회</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="wrap">
    <main class="container">
      <h1>프로모션 조회</h1>
      <p class="desc">
        상품코드를 입력하면 CSV 파일에서 해당 프로모션명, 적용기간, 총상품가격 정보를 조회합니다.
      </p>

      <div class="search-box">
        <input
          type="text"
          id="productCode"
          placeholder="상품코드를 입력하세요"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="searchBtn" type="button">조회하기</button>
      </div>

      <section id="result" class="result">
        <p class="guide">데이터를 불러오는 중입니다...</p>
      </section>
    </main>
  </div>

  <!-- CSV 데이터를 JS 변수(window.PROMOTION_CSV)로 임베드 (file:// 환경 대응) -->
  <script src="./master_promotion.js"></script>
  <script src="./script.js"></script>
</body>
</html>
