<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상품 프로모션 조회</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <h1>상품 프로모션 조회</h1>

    <div class="search-box">
      <input
        type="text"
        id="productCode"
        placeholder="상품코드를 입력하세요"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="searchBtn" type="button">조회</button>
    </div>

    <div id="result">
      <p class="guide">조회할 상품코드를 입력해 주세요.</p>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
