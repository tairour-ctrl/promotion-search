<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상품코드로 프로모션 조회</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="wrap">
    <main class="card">
      <div class="eyebrow">HANA TOUR PROMOTION SEARCH</div>
      <h1>상품코드로 프로모션 조회</h1>
      <p class="desc">
        코드를 입력하면 CSV 파일에서 해당 데이터를 찾아 현재 적용 중인 프로모션 정보를 보여줍니다.
      </p>

      <div class="search-box">
        <input
          type="text"
          id="productCode"
          placeholder="상품코드를 입력하세요"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="searchBtn" type="button">조회하기</button>
      </div>

      <section id="result" class="result">
        <p class="guide">CSV 로드 완료. 상품코드를 입력해 조회하세요.</p>
      </section>
    </main>
  </div>

  <script src="./script.js"></script>
</body>
</html>
